# Private container-local socket; never expose ClamAV's unauthenticated TCP port.
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
TemporaryDirectory /tmp/pmi-clamav
LocalSocket /tmp/pmi-clamav/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
Foreground yes
User clamav
SelfCheck 0
ConcurrentDatabaseReload no
FailIfCvdOlderThan 1
MaxThreads 1
MaxQueue 2
CommandReadTimeout 5
ReadTimeout 15
SendBufTimeout 1000
StreamMaxLength 2M
MaxFileSize 2M
MaxScanSize 8M
MaxScanTime 15000
MaxRecursion 8
MaxFiles 128
AlertExceedsMax yes
LogClean no
LogVerbose no
ExtendedDetectionInfo no
