name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Actual quality checks in a credential-free namespace
        run: python3 scripts/isolated-verify.py --ci-sudo --task quality --output "$RUNNER_TEMP/pmi-quality" --timeout-seconds 900 --memory-mib 4096 --typecheck-heap-mib 3072

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Complete unit inventory after OS isolation controls
        run: python3 scripts/isolated-verify.py --ci-sudo --task unit --output "$RUNNER_TEMP/pmi-unit" --timeout-seconds 900 --memory-mib 4096

  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Complete backend inventory with public emulator binaries and no provider route
        run: python3 scripts/isolated-verify.py --ci-sudo --task firestore --output "$RUNNER_TEMP/pmi-firestore" --timeout-seconds 900 --memory-mib 4096

  policy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Public font preparation, actual production audit, policy checks and build
        run: python3 scripts/isolated-verify.py --ci-sudo --task policy-build --output "$RUNNER_TEMP/pmi-policy-build" --timeout-seconds 900 --memory-mib 6144 --build-heap-mib 3072

  verify:
    if: ${{ always() }}
    needs: [quality, unit, firestore, policy-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel verification lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          FIRESTORE_RESULT: ${{ needs.firestore.result }}
          POLICY_BUILD_RESULT: ${{ needs['policy-build'].result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$FIRESTORE_RESULT" = "success"
          test "$POLICY_BUILD_RESULT" = "success"
