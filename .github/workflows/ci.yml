name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks. Main runs are never
# cancelled: each main commit keeps its own complete result for the release watcher.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every lane runs in scripts/isolated-verify.py's credential-free namespace on all of the runner's
# CPUs. The npm download cache only feeds the anonymous `npm ci`, which still verifies every
# tarball against package-lock.json; nothing caches a check's result.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the public npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmi-npm-cache
          key: pmi-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pmi-npm-${{ runner.os }}-
      - name: Actual quality checks in a credential-free namespace
        run: |
          mkdir -p "$RUNNER_TEMP/pmi-npm-cache"
          python3 scripts/isolated-verify.py --ci-sudo --task quality --output "$RUNNER_TEMP/pmi-quality" --npm-cache "$RUNNER_TEMP/pmi-npm-cache" --timeout-seconds 900 --memory-mib 4096 --typecheck-heap-mib 3072
      - name: Retain the lane's evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmi-quality-evidence
          path: ${{ runner.temp }}/pmi-quality
          if-no-files-found: ignore
          retention-days: 14

  unit-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the public npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmi-npm-cache
          key: pmi-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pmi-npm-${{ runner.os }}-
      - name: Unit inventory, first half, after OS isolation controls
        run: |
          mkdir -p "$RUNNER_TEMP/pmi-npm-cache"
          python3 scripts/isolated-verify.py --ci-sudo --task unit-1 --output "$RUNNER_TEMP/pmi-unit-1" --npm-cache "$RUNNER_TEMP/pmi-npm-cache" --timeout-seconds 900 --memory-mib 4096
      - name: Retain the lane's evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmi-unit-1-evidence
          path: ${{ runner.temp }}/pmi-unit-1
          if-no-files-found: ignore
          retention-days: 14

  unit-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the public npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmi-npm-cache
          key: pmi-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pmi-npm-${{ runner.os }}-
      - name: Unit inventory, second half, after OS isolation controls
        run: |
          mkdir -p "$RUNNER_TEMP/pmi-npm-cache"
          python3 scripts/isolated-verify.py --ci-sudo --task unit-2 --output "$RUNNER_TEMP/pmi-unit-2" --npm-cache "$RUNNER_TEMP/pmi-npm-cache" --timeout-seconds 900 --memory-mib 4096
      - name: Retain the lane's evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmi-unit-2-evidence
          path: ${{ runner.temp }}/pmi-unit-2
          if-no-files-found: ignore
          retention-days: 14

  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the public npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmi-npm-cache
          key: pmi-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pmi-npm-${{ runner.os }}-
      - name: Complete backend inventory with public emulator binaries and no provider route
        run: |
          mkdir -p "$RUNNER_TEMP/pmi-npm-cache"
          python3 scripts/isolated-verify.py --ci-sudo --task firestore --output "$RUNNER_TEMP/pmi-firestore" --npm-cache "$RUNNER_TEMP/pmi-npm-cache" --timeout-seconds 900 --memory-mib 4096
      - name: Retain the lane's evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmi-firestore-evidence
          path: ${{ runner.temp }}/pmi-firestore
          if-no-files-found: ignore
          retention-days: 14

  policy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the public npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmi-npm-cache
          key: pmi-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pmi-npm-${{ runner.os }}-
      - name: Public font preparation, actual production audit, policy checks and build
        run: |
          mkdir -p "$RUNNER_TEMP/pmi-npm-cache"
          python3 scripts/isolated-verify.py --ci-sudo --task policy-build --output "$RUNNER_TEMP/pmi-policy-build" --npm-cache "$RUNNER_TEMP/pmi-npm-cache" --timeout-seconds 900 --memory-mib 8192 --build-heap-mib 3072
      - name: Retain the lane's evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmi-policy-build-evidence
          path: ${{ runner.temp }}/pmi-policy-build
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Keep the browser runner on an OS supported by the locked Playwright build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the public npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pmi-npm-cache
          key: pmi-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pmi-npm-${{ runner.os }}-
      - name: Required rendered Help and complete served E2E with the public browser and emulator
        run: |
          mkdir -p "$RUNNER_TEMP/pmi-npm-cache"
          python3 scripts/isolated-verify.py --ci-sudo --task e2e --output "$RUNNER_TEMP/pmi-e2e" --npm-cache "$RUNNER_TEMP/pmi-npm-cache" --timeout-seconds 900 --memory-mib 6144
      - name: Retain the lane's evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmi-e2e-evidence
          path: |
            ${{ runner.temp }}/pmi-e2e/evidence
            ${{ runner.temp }}/pmi-e2e/runtime
          if-no-files-found: ignore
          retention-days: 14

  verify:
    if: ${{ !cancelled() }}
    needs: [quality, unit-1, unit-2, firestore, policy-build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel verification lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_1_RESULT: ${{ needs['unit-1'].result }}
          UNIT_2_RESULT: ${{ needs['unit-2'].result }}
          FIRESTORE_RESULT: ${{ needs.firestore.result }}
          POLICY_BUILD_RESULT: ${{ needs['policy-build'].result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$UNIT_1_RESULT" = "success"
          test "$UNIT_2_RESULT" = "success"
          test "$FIRESTORE_RESULT" = "success"
          test "$POLICY_BUILD_RESULT" = "success"
          test "$E2E_RESULT" = "success"
